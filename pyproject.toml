[project]
name = "greysweep"
version = "0.1.0"
description = "Security audit for AI agent setups: MCP servers, Claude Code / Codex / Cursor configs, skills, hooks and instruction files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "GreyHatInc" }]
keywords = ["mcp", "security", "ai-agents", "claude-code", "codex", "prompt-injection", "audit", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/121Nanami/greysweep"
Issues = "https://github.com/121Nanami/greysweep/issues"

[project.scripts]
greysweep = "greysweep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greysweep"]
